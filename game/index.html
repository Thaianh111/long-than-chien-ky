<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Long Thần Chiến Ký</title>
<link rel="icon" href="assets/frames/f_id1.png">
<style>
  html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  canvas{position:absolute;inset:0;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #hud{position:absolute;left:10px;top:8px;color:#f3e6c4;font-size:13px;line-height:1.45;
    text-shadow:0 1px 2px #000;pointer-events:none;max-width:60%}
  #hud b{color:#ffcf5a}
  #pad{position:absolute;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.07);opacity:.85;
    border:2px solid rgba(255,220,150,.45);color:#f3e6c4;font-weight:700;display:flex;
    align-items:center;justify-content:center;font-size:15px;touch-action:none}
  .btn.on{background:rgba(255,190,80,.38)}
  #rot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    color:#f3e6c4;background:#0b0d14;font-size:18px;padding:30px}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(11,13,20,.86);color:#f3e6c4;gap:14px;z-index:5}
  #menu h1{margin:0;font-size:22px;color:#ffcf5a;letter-spacing:1px}
  #menu .row{display:flex;gap:18px}
  #menu button{font:inherit;cursor:pointer;border-radius:14px;padding:10px 14px 12px;min-width:150px;color:#f3e6c4;
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;font-weight:700}
  #menu button img{width:120px;height:88px;object-fit:contain;image-rendering:pixelated}
  #menu small{font-weight:400;opacity:.75;font-size:12px}
  #menu .xl{background:#3a1512;border:2px solid #c9a227}
  #menu .tv{background:#0f2e38;border:2px solid #7fe3ff}
  #menu button:disabled{opacity:.4;cursor:wait}
  #swapBtn{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;font:inherit;font-size:13px;font-weight:700;
    padding:6px 14px;border-radius:20px;border:2px solid rgba(255,220,150,.6);background:rgba(20,26,46,.8);color:#f3e6c4;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="pad">
  <div class="btn" data-k="left"  style="left:3%;bottom:8%;width:84px;height:84px">◀</div>
  <div class="btn" data-k="right" style="left:calc(3% + 96px);bottom:8%;width:84px;height:84px">▶</div>
  <div class="btn" data-k="dash"  style="right:calc(3% + 196px);bottom:6%;width:74px;height:74px">LƯỚT</div>
  <div class="btn" data-k="attack" style="right:calc(3% + 98px);bottom:20%;width:84px;height:84px">CHÉM</div>
  <div class="btn" data-k="jump"  style="right:3%;bottom:6%;width:88px;height:88px">NHẢY</div>
</div>
<div id="menu">
  <h1>LONG THẦN CHIẾN KÝ</h1><div id="loadTxt">Đang tải… 0%</div>
  <div class="row">
    <button class="xl" data-hero="xl"><img src="assets/frames/f_id1.png" alt="">XÍCH LONG<small>Kiếm sĩ · đao laze</small></button>
    <button class="tv" data-hero="tv"><img src="assets/frames/f_tv_mau.png" alt="">THANH VŨ<small>Xạ thủ · Thần Nỏ</small></button>
  </div>
</div>
<button id="swapBtn">⇄ Đổi sang Thanh Vũ</button>
<div id="rot">Xoay ngang điện thoại để chơi thử 🔄</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
