<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Long Thần Chiến Ký — Bản thử điều khiển Xích Long</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  canvas{position:absolute;inset:0;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #hud{position:absolute;left:10px;top:8px;color:#f3e6c4;font-size:13px;line-height:1.45;
    text-shadow:0 1px 2px #000;pointer-events:none;max-width:60%}
  #hud b{color:#ffcf5a}
  #pad{position:absolute;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.07);opacity:.85;
    border:2px solid rgba(255,220,150,.45);color:#f3e6c4;font-weight:700;display:flex;
    align-items:center;justify-content:center;font-size:15px;touch-action:none}
  .btn.on{background:rgba(255,190,80,.38)}
  #rot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    color:#f3e6c4;background:#0b0d14;font-size:18px;padding:30px}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="pad">
  <div class="btn" data-k="left"  style="left:3%;bottom:8%;width:84px;height:84px">◀</div>
  <div class="btn" data-k="right" style="left:calc(3% + 96px);bottom:8%;width:84px;height:84px">▶</div>
  <div class="btn" data-k="dash"  style="right:calc(3% + 196px);bottom:6%;width:74px;height:74px">LƯỚT</div>
  <div class="btn" data-k="attack" style="right:calc(3% + 98px);bottom:20%;width:84px;height:84px">CHÉM</div>
  <div class="btn" data-k="jump"  style="right:3%;bottom:6%;width:88px;height:88px">NHẢY</div>
</div>
<div id="rot">Xoay ngang điện thoại để chơi thử 🔄</div>
<script>
/* =========================================================
   LONG THẦN CHIẾN KÝ — bản thử điều khiển (vứt đi sau khi thử)
   © Võ Thái Anh · VTA Games
   ---------------------------------------------------------
   CHỈNH CẢM GIÁC TAY Ở ĐÂY. Đơn vị: pixel (1 ô = 16px), giây.
   ========================================================= */
const T = {
  GRAVITY: 1500,          // trọng lực
  MAX_FALL: 520,          // tốc độ rơi tối đa
  RUN_SPEED: 150,         // tốc độ chạy
  ACCEL_GROUND: 2200,     // tăng tốc trên đất
  ACCEL_AIR: 1300,        // đổi hướng trên không
  JUMP_VEL: 430,          // lực nhảy
  JUMP_CUT: 0.45,         // nhả nút nhảy sớm -> nhảy thấp (0..1)
  COYOTE: 0.09,           // vẫn nhảy được ngay sau khi rời mép
  JUMP_BUFFER: 0.12,      // bấm nhảy sớm trước khi chạm đất vẫn tính
  DASH_SPEED: 310,        // tốc độ lướt
  DASH_TIME: 0.30,        // thời gian lướt tối đa (giữ nút)
  DASH_MIN: 0.10,         // lướt ngắn nhất khi bấm nhả nhanh
  AIR_DASHES: 1,          // số lần lướt trên không (0 = như X1 gốc)
  WALL_SLIDE: 75,         // tốc độ trượt tường
  WALL_JUMP_VX: 175,      // lực bật ngang khi nhảy tường
  WALL_JUMP_VY: 410,      // lực bật dọc khi nhảy tường
  WALL_JUMP_LOCK: 0.13,   // khóa điều khiển sau khi bật tường
  HITSTOP: 0.055,         // khựng hình khi chém trúng
  SHAKE: 2.5,             // rung màn hình khi chém trúng
  COMBO: [                // 3 nhát chém
    { time: 0.20, from: 0.03, to: 0.11, reach: 30, h: 26, dmg: 1, lunge: 25,  knock: 120 },
    { time: 0.22, from: 0.04, to: 0.12, reach: 32, h: 30, dmg: 1, lunge: 35,  knock: 140 },
    { time: 0.34, from: 0.07, to: 0.17, reach: 40, h: 36, dmg: 2, lunge: 110, knock: 260 },
  ],
  AIR_SLASH: { time: 0.24, from: 0.02, to: 0.14, reach: 34, h: 40, dmg: 1, lunge: 0, knock: 150 },
};

/* ---------------- màn chơi (vẽ bằng khối ô) ---------------- */
const TS = 16, MW = 110, MH = 17;
const map = Array.from({length: MH}, () => new Uint8Array(MW));
const rect = (x, y, w, h, v = 1) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < MW && j < MH) map[j][i] = v; };
rect(0, 15, MW, 2);            // nền
rect(0, 0, 1, MH);             // tường trái
rect(MW - 1, 0, 1, MH);        // tường phải
rect(10, 12, 4, 1); rect(16, 10, 3, 1);          // bậc thang
rect(22, 15, 4, 2, 0);                           // hố nhỏ (nhảy thường)
rect(34, 4, 1, 11); rect(38, 6, 1, 9);           // giếng nhảy tường
rect(38, 6, 6, 1);                               // gờ trên giếng
rect(44, 6, 1, 4);
rect(52, 15, 7, 2, 0);                           // hố lớn: cần LƯỚT + NHẢY
rect(64, 11, 5, 1); rect(72, 9, 5, 1); rect(80, 11, 5, 1);   // đấu trường
rect(90, 8, 1, 7);                               // tường cuối để tập bám
const checkpoints = [{ x: 3 * TS, y: 13 * TS }, { x: 46 * TS, y: 13 * TS }, { x: 61 * TS, y: 13 * TS }];
const solidAt = (px, py) => { const i = Math.floor(px / TS), j = Math.floor(py / TS); return i >= 0 && i < MW && j >= 0 && j < MH && map[j][i] === 1; };

/* ---------------- nhập liệu ---------------- */
const keys = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const touch = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const pad = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'jump', KeyK: 'jump', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  KeyX: 'attack', KeyJ: 'attack', KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash' };
const tap = {};
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { if (!e.repeat) tap[k] = 1; keys[k] = 1; e.preventDefault(); } if (e.code === 'KeyR') respawn(); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = 0; e.preventDefault(); } });
const usingTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (usingTouch) document.getElementById('pad').style.display = 'block';
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); touch[k] = 1; tap[k] = 1; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touch[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
addEventListener('contextmenu', e => e.preventDefault());
function readPad() {
  const g = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  for (const k in pad) pad[k] = 0;
  if (!g) return;
  const ax = g.axes[0] || 0, b = i => g.buttons[i] && g.buttons[i].pressed;
  pad.left = ax < -0.4 || b(14) ? 1 : 0; pad.right = ax > 0.4 || b(15) ? 1 : 0;
  pad.jump = b(0) ? 1 : 0; pad.attack = b(2) || b(3) ? 1 : 0; pad.dash = b(1) || b(5) || b(7) ? 1 : 0;
}
const held = {}, prev = {}, pressed = {}, released = {};
function pollInput() {
  readPad();
  for (const k in keys) {
    held[k] = keys[k] || touch[k] || pad[k] ? 1 : 0;
    pressed[k] = pressed[k] || tap[k] || (held[k] && !prev[k]); tap[k] = 0; released[k] = released[k] || (!held[k] && prev[k]); prev[k] = held[k];
  }
}

/* ---------------- người chơi: Xích Long ---------------- */
const P = { w: 12, h: 26 };
function resetPlayer(cp) {
  Object.assign(P, { x: cp.x, y: cp.y - P.h, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, jumpBuf: 0,
    dash: 0, dashHeld: 0, airDashes: T.AIR_DASHES, dashMomentum: false, wall: 0, wallLock: 0,
    atk: null, atkT: 0, combo: 0, comboQueued: false, hitSet: new Set(), ghosts: [], trail: [] });
}
let cpIndex = 0; resetPlayer(checkpoints[0]);
function respawn() { resetPlayer(checkpoints[cpIndex]); }

function collideX(o) {
  const top = o.y + 1, bot = o.y + o.h - 1;
  if (o.vx > 0) { const r = o.x + o.w; for (let y = top; y <= bot; y += 6) if (solidAt(r, y) || solidAt(r, bot)) { o.x = Math.floor(r / TS) * TS - o.w - 0.01; o.vx = 0; return 1; } }
  else if (o.vx < 0) { for (let y = top; y <= bot; y += 6) if (solidAt(o.x, y) || solidAt(o.x, bot)) { o.x = (Math.floor(o.x / TS) + 1) * TS + 0.01; o.vx = 0; return -1; } }
  return 0;
}
function collideY(o) {
  const l = o.x + 1, r = o.x + o.w - 1;
  o.ground = false;
  if (o.vy > 0) { const b = o.y + o.h; if (solidAt(l, b) || solidAt(r, b)) { o.y = Math.floor(b / TS) * TS - o.h; o.vy = 0; o.ground = true; } }
  else if (o.vy < 0) { if (solidAt(l, o.y) || solidAt(r, o.y)) { o.y = (Math.floor(o.y / TS) + 1) * TS; o.vy = 0; } }
}
const touchingWall = dir => { const x = dir > 0 ? P.x + P.w + 1 : P.x - 1; return solidAt(x, P.y + 4) && solidAt(x, P.y + P.h - 6); };

function startAttack() {
  const air = !P.ground;
  const step = air ? T.AIR_SLASH : T.COMBO[P.combo];
  P.atk = step; P.atkT = 0; P.hitSet = new Set(); P.comboQueued = false; P.atkAir = air;
  if (!air && step.lunge) P.vx = P.face * step.lunge * 2.2;
}

function updatePlayer(dt) {
  const dirIn = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  P.coyote = P.ground ? T.COYOTE : Math.max(0, P.coyote - dt);
  P.jumpBuf = pressed.jump ? T.JUMP_BUFFER : Math.max(0, P.jumpBuf - dt);
  P.wallLock = Math.max(0, P.wallLock - dt);

  // --- chém ---
  if (pressed.attack) {
    if (!P.atk) { if (P.ground && P.combo > 2) P.combo = 0; startAttack(); }
    else if (!P.atkAir && P.combo < 2) P.comboQueued = true;
  }
  if (P.atk) {
    P.atkT += dt;
    if (P.atkT >= P.atk.time) {
      if (P.comboQueued && P.ground && !P.atkAir) { P.combo++; startAttack(); }
      else { P.atk = null; P.combo = 0; }
    }
  }
  const groundSlashing = P.atk && !P.atkAir;

  // --- lướt ---
  if (pressed.dash && !P.dash && !groundSlashing) {
    if (P.ground) { P.dash = T.DASH_TIME; P.dashHeld = 0; }
    else if (P.airDashes > 0 && !P.wall) { P.airDashes--; P.dash = T.DASH_TIME * 0.8; P.dashHeld = 0; P.vy = 0; }
    if (P.dash && dirIn) P.face = dirIn;
  }
  if (P.dash) {
    P.dashHeld += dt; P.dash -= dt;
    if ((!held.dash && P.dashHeld > T.DASH_MIN) || (dirIn && dirIn !== P.face)) P.dash = 0;
    P.vx = P.face * T.DASH_SPEED;
    if (!P.ground) P.vy = Math.min(P.vy, 0);
    if (P.ground) P.dashMomentum = true;
    if (Math.random() < 0.6) P.ghosts.push({ x: P.x, y: P.y, f: P.face, a: 0.5 });
    if (P.dash <= 0) P.dash = 0;
  }

  // --- chạy ---
  if (!P.dash && P.wallLock <= 0) {
    if (groundSlashing) { P.vx *= Math.pow(0.0005, dt); }
    else {
      const top = P.dashMomentum && !P.ground ? T.DASH_SPEED : T.RUN_SPEED;
      const target = dirIn * top;
      const acc = P.ground ? T.ACCEL_GROUND : T.ACCEL_AIR;
      if (P.vx < target) P.vx = Math.min(target, P.vx + acc * dt);
      else if (P.vx > target) P.vx = Math.max(target, P.vx - acc * dt);
      if (dirIn) P.face = dirIn;
    }
  }

  // --- bám tường ---
  P.wall = 0;
  if (!P.ground && !P.dash) {
    if (dirIn && touchingWall(dirIn) && P.vy > -60) P.wall = dirIn;
  }

  // --- nhảy ---
  if (P.jumpBuf > 0) {
    if (P.coyote > 0) {
      P.vy = -T.JUMP_VEL; P.coyote = 0; P.jumpBuf = 0;
      P.dashMomentum = !!(P.dash || held.dash); P.dash = 0; P.ground = false;
    } else if (!P.ground && (P.wall || touchingWall(-1) || touchingWall(1))) {
      const w = P.wall || (touchingWall(1) ? 1 : -1);
      P.dashMomentum = !!held.dash;
      P.vx = -w * (P.dashMomentum ? T.DASH_SPEED : T.WALL_JUMP_VX);
      P.vy = -T.WALL_JUMP_VY; P.face = -w; P.wallLock = T.WALL_JUMP_LOCK; P.jumpBuf = 0; P.wall = 0;
      sparks(P.x + (w > 0 ? P.w : 0), P.y + P.h - 4, 6, '#ffd34d');
    }
  }
  if (released.jump && P.vy < 0) P.vy *= T.JUMP_CUT;

  // --- trọng lực ---
  if (!(P.dash && !P.ground)) {
    P.vy = Math.min(P.vy + T.GRAVITY * dt, T.MAX_FALL);
    if (P.wall && P.vy > T.WALL_SLIDE) { P.vy = T.WALL_SLIDE; if (Math.random() < 0.3) sparks(P.x + (P.wall > 0 ? P.w : 0), P.y + 6, 1, '#ffb347'); }
  }

  P.x += P.vx * dt; collideX(P);
  const wasGround = P.ground;
  P.y += P.vy * dt; collideY(P);
  if (P.ground) { P.airDashes = T.AIR_DASHES; if (!P.dash) P.dashMomentum = false; if (!wasGround) dust(P.x + P.w / 2, P.y + P.h); }
  if (P.ground && P.atkAir) { P.atk = null; P.combo = 0; }

  // checkpoint & rơi hố
  checkpoints.forEach((c, i) => { if (P.x > c.x - 8 && i > cpIndex) cpIndex = i; });
  if (P.y > MH * TS + 40) respawn();

  // dải lụa
  P.trail.unshift({ x: P.x + P.w / 2 - P.face * 4, y: P.y + 14 });
  if (P.trail.length > 10) P.trail.pop();
  P.ghosts.forEach(g => g.a -= dt * 2.2); P.ghosts = P.ghosts.filter(g => g.a > 0);
}

function slashBox() {
  const a = P.atk; if (!a || P.atkT < a.from || P.atkT > a.to) return null;
  const x = P.face > 0 ? P.x + P.w - 2 : P.x - a.reach + 2;
  return { x, y: P.y + P.h / 2 - a.h / 2 - 2, w: a.reach, h: a.h };
}

/* ---------------- quái để chém thử ---------------- */
const foes = [];
const addFoe = (type, tx, ty) => foes.push({ type, ox: tx * TS, oy: ty * TS, x: tx * TS, y: ty * TS, w: type === 'drone' ? 16 : 18, h: type === 'drone' ? 14 : 22,
  hp: type === 'drone' ? 3 : 5, maxHp: type === 'drone' ? 3 : 5, vx: 0, vy: 0, flash: 0, dead: 0, t: Math.random() * 6, dir: -1 });
addFoe('drone', 13, 9); addFoe('walker', 28, 14); addFoe('drone', 47, 4); addFoe('walker', 66, 14); addFoe('drone', 74, 7);
addFoe('walker', 82, 14); addFoe('drone', 86, 10); addFoe('walker', 96, 14);
function updateFoes(dt) {
  const box = slashBox();
  for (const f of foes) {
    if (f.dead > 0) { f.dead -= dt; if (f.dead <= 0) Object.assign(f, { x: f.ox, y: f.oy, hp: f.maxHp, vx: 0, vy: 0 }); continue; }
    f.t += dt; f.flash = Math.max(0, f.flash - dt);
    if (f.type === 'drone') {
      f.vx *= Math.pow(0.02, dt); f.x += f.vx * dt;
      f.y = f.oy + Math.sin(f.t * 2) * 6 + (f.kby || 0); f.kby = (f.kby || 0) * Math.pow(0.05, dt);
    } else {
      if (Math.abs(f.vx) < 30) f.vx = f.dir * 30;
      f.vy = Math.min(f.vy + T.GRAVITY * dt, T.MAX_FALL);
      f.x += f.vx * dt; if (collideX(f)) f.dir *= -1;
      const ahead = f.dir > 0 ? f.x + f.w + 2 : f.x - 2;
      f.y += f.vy * dt; collideY(f);
      if (f.ground && !solidAt(ahead, f.y + f.h + 4) && Math.abs(f.vx) <= 31) { f.dir *= -1; f.vx = f.dir * 30; }
      if (Math.abs(f.vx) > 30) f.vx *= Math.pow(0.01, dt);
      if (f.y > MH * TS + 40) f.dead = 0.01;
    }
    if (box && !P.hitSet.has(f) && box.x < f.x + f.w && box.x + box.w > f.x && box.y < f.y + f.h && box.y + box.h > f.y) {
      P.hitSet.add(f); f.hp -= P.atk.dmg; f.flash = 0.12;
      f.vx = P.face * P.atk.knock; if (f.type === 'drone') f.kby = -8; else f.vy = -120;
      hitstop = T.HITSTOP * (P.atk.dmg > 1 ? 1.8 : 1); shake = T.SHAKE * (P.atk.dmg > 1 ? 2 : 1);
      sparks(f.x + f.w / 2, f.y + f.h / 2, 8, '#ff6a2b'); hits++;
      if (f.hp <= 0) { f.dead = 2.5; sparks(f.x + f.w / 2, f.y + f.h / 2, 22, '#ffd34d'); kills++; }
    }
  }
}

/* ---------------- hiệu ứng ---------------- */
const parts = [];
function sparks(x, y, n, c) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 160; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.25 + Math.random() * 0.3, c }); } }
function dust(x, y) { for (let i = 0; i < 5; i++) parts.push({ x: x + (Math.random() - 0.5) * 10, y, vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 40, life: 0.3, c: '#9aa3b5' }); }
function updateParts(dt) { for (const p of parts) { p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1); }
let hitstop = 0, shake = 0, hits = 0, kills = 0;

/* ---------------- vẽ ---------------- */
let VW = 480; const VH = 270;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cv.height = VH;
function fit() { VW = Math.round(Math.max(400, Math.min(640, VH * innerWidth / innerHeight))); cv.width = VW; const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); fit();
const cam = { x: 0, y: 0 };
let time = 0;

function drawPlayer() {
  const x = Math.round(P.x - cam.x), y = Math.round(P.y - cam.y), f = P.face;
  // bóng mờ khi lướt
  for (const g of P.ghosts) { cx.globalAlpha = g.a * 0.6; cx.fillStyle = '#ff4a3a'; cx.fillRect(Math.round(g.x - cam.x), Math.round(g.y - cam.y) + 4, P.w, P.h - 4); }
  cx.globalAlpha = 1;
  // dải lụa đỏ
  cx.strokeStyle = '#d8352a'; cx.lineWidth = 3; cx.beginPath();
  P.trail.forEach((t, i) => { const px = t.x - cam.x - f * i * 1.5, py = t.y - cam.y + i * 0.6 + Math.sin(time * 12 + i) * 1.2; i ? cx.lineTo(px, py) : cx.moveTo(px, py); });
  cx.stroke();
  const run = P.ground && Math.abs(P.vx) > 20 ? Math.sin(time * 18) : 0;
  // chân
  cx.fillStyle = '#7E1712';
  cx.fillRect(x + 2, y + 18, 4, 8 - Math.max(0, run * 3)); cx.fillRect(x + 7, y + 18, 4, 8 - Math.max(0, -run * 3));
  // thân
  cx.fillStyle = '#B3261E'; cx.fillRect(x + 1, y + 8, 10, 11);
  cx.fillStyle = '#C9A227'; cx.fillRect(x + 1, y + 16, 10, 2); cx.fillRect(x + 5, y + 11, 2, 2);
  // vai vảy rồng
  cx.fillStyle = '#B3261E'; cx.fillRect(x - 1, y + 8, 4, 4); cx.fillRect(x + 9, y + 8, 4, 4);
  cx.fillStyle = '#C9A227'; cx.fillRect(x - 1, y + 8, 4, 1); cx.fillRect(x + 9, y + 8, 4, 1);
  // đầu + mũ trụ + sừng
  cx.fillStyle = '#B3261E'; cx.fillRect(x + 2, y, 8, 8);
  cx.fillStyle = '#2a1a14'; cx.fillRect(x + 2, y + 5, 8, 3);
  cx.fillStyle = '#ffd34d'; cx.fillRect(f > 0 ? x + 7 : x + 3, y + 3, 2, 1);
  cx.fillStyle = '#C9A227'; cx.fillRect(f > 0 ? x : x + 10, y - 2, 2, 3); cx.fillRect(f > 0 ? x - 2 : x + 12, y - 3, 2, 2);
  // đao + vệt chém
  if (P.atk) {
    const a = P.atk, k = Math.min(1, P.atkT / a.to), hx = x + (f > 0 ? P.w : 0), hy = y + 13;
    const start = P.atkAir ? -2.6 : (P.combo === 1 ? 1.2 : -1.6), end = P.atkAir ? 2.6 : (P.combo === 1 ? -1.4 : 1.3);
    const ang = start + (end - start) * k;
    const r = a.reach;
    if (P.atkT >= a.from && P.atkT <= a.to + 0.04) {
      cx.strokeStyle = P.combo === 2 && !P.atkAir ? 'rgba(255,120,40,.95)' : 'rgba(255,90,50,.85)';
      cx.lineWidth = P.combo === 2 && !P.atkAir ? 6 : 4; cx.beginPath();
      const s0 = start, s1 = ang, ccw = end < start;
      if (f > 0) cx.arc(hx, hy, r, s0, s1, ccw); else cx.arc(hx, hy, r, Math.PI - s0, Math.PI - s1, !ccw);
      cx.stroke();
    }
    cx.strokeStyle = '#e9e4dc'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(hx, hy);
    const bx = f > 0 ? Math.cos(ang) : -Math.cos(ang);
    cx.lineTo(hx + bx * (r - 6), hy + Math.sin(ang) * (r - 6)); cx.stroke();
  } else {
    cx.fillStyle = '#e9e4dc'; cx.fillRect(f > 0 ? x - 2 : x + 12, y + 9, 2, 12);
  }
}

function draw() {
  const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0, sy = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  // nền trời đêm + mưa lũ
  const gr = cx.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#141a2e'); gr.addColorStop(1, '#2a2440');
  cx.fillStyle = gr; cx.fillRect(0, 0, VW, VH);
  cx.save(); cx.translate(sx, sy);
  // núi xa (parallax)
  cx.fillStyle = '#1d2238';
  for (let i = 0; i < 12; i++) { const bx = i * 90 - (cam.x * 0.25) % 90; cx.beginPath(); cx.moveTo(bx, 200); cx.lineTo(bx + 45, 120 + (i % 3) * 20); cx.lineTo(bx + 90, 200); cx.fill(); }
  // vòng xoắn Cổ Loa xa xa
  cx.strokeStyle = 'rgba(212,175,55,.18)'; cx.lineWidth = 2; cx.beginPath();
  for (let t = 0; t < 18.8; t += 0.1) { const r = 6 + t * 3, px = 380 - cam.x * 0.08 + Math.cos(t + time * 0.2) * r, py = 70 + Math.sin(t + time * 0.2) * r * 0.5; t ? cx.lineTo(px, py) : cx.moveTo(px, py); }
  cx.stroke();
  // ô gạch
  const i0 = Math.floor(cam.x / TS), i1 = i0 + VW / TS + 2;
  for (let j = 0; j < MH; j++) for (let i = i0; i < i1; i++) {
    if (i < 0 || i >= MW || map[j][i] !== 1) continue;
    const X = i * TS - cam.x, Y = j * TS - cam.y;
    cx.fillStyle = '#2e3346'; cx.fillRect(X, Y, TS, TS);
    cx.fillStyle = '#3c4259'; cx.fillRect(X, Y, TS, 3);
    if (j === 0 || map[j - 1][i] !== 1) { cx.fillStyle = '#C9A227'; cx.fillRect(X, Y, TS, 1); }
  }
  // nước lũ dâng
  cx.fillStyle = 'rgba(60,110,150,.55)';
  for (let X = 0; X < VW; X += 4) { const wy = MH * TS - 10 - cam.y + Math.sin((X + cam.x) * 0.05 + time * 3) * 2; cx.fillRect(X, wy, 4, VH); }
  // cờ checkpoint
  checkpoints.forEach((c, i) => { const X = c.x - cam.x, Y = c.y - cam.y; cx.fillStyle = '#888'; cx.fillRect(X, Y - 26, 2, 26); cx.fillStyle = i <= cpIndex ? '#d8352a' : '#555'; cx.fillRect(X + 2, Y - 26, 12, 8); });
  // quái
  for (const f of foes) {
    if (f.dead > 0) continue;
    const X = Math.round(f.x - cam.x), Y = Math.round(f.y - cam.y);
    cx.fillStyle = f.flash > 0 ? '#fff' : (f.type === 'drone' ? '#4c7a8f' : '#5b4f7a');
    if (f.type === 'drone') { cx.fillRect(X, Y + 3, f.w, f.h - 6); cx.fillRect(X + 4, Y, f.w - 8, f.h); cx.fillStyle = '#9fe8ff'; cx.fillRect(X + 6, Y + 5, 4, 4); }
    else { cx.fillRect(X, Y, f.w, f.h); cx.fillStyle = '#ff5a5a'; cx.fillRect(f.dir > 0 ? X + 12 : X + 2, Y + 5, 4, 3); }
    cx.fillStyle = '#000'; cx.fillRect(X, Y - 5, f.w, 2); cx.fillStyle = '#ffcf5a'; cx.fillRect(X, Y - 5, f.w * f.hp / f.maxHp, 2);
  }
  drawPlayer();
  for (const p of parts) { cx.globalAlpha = Math.min(1, p.life * 3); cx.fillStyle = p.c; cx.fillRect(p.x - cam.x, p.y - cam.y, 2, 2); }
  cx.globalAlpha = 1;
  // gợi ý trong màn
  cx.fillStyle = 'rgba(243,230,196,.75)'; cx.font = '8px sans-serif';
  [[30, 'Hố nhỏ: nhảy thường'], [34.5, 'Giếng: bám tường + nhảy qua lại'], [50, 'Hố lớn: LƯỚT rồi NHẢY'], [62, 'Đấu trường: tập combo 3 nhát']]
    .forEach(([tx, s]) => cx.fillText(s, tx * TS - cam.x - 40, 3 * TS - cam.y));
  cx.restore();
}

/* ---------------- vòng lặp ---------------- */
const hud = document.getElementById('hud');
function updateHud() {
  const ctl = usingTouch ? '' : '<br><b>←→</b> chạy · <b>Z/K/Space</b> nhảy · <b>X/J</b> chém · <b>C/L/Shift</b> lướt · <b>R</b> về điểm lưu';
  hud.innerHTML = `<b>Long Thần Chiến Ký</b> — bản thử điều khiển Xích Long${ctl}<br>Trúng: ${hits} · Hạ: ${kills}` +
    (P.atk && !P.atkAir ? ` · Combo ${P.combo + 1}/3` : '');
}
let last = performance.now(), acc = 0; const STEP = 1 / 120;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  pollInput();
  while (acc >= STEP) {
    acc -= STEP; time += STEP;
    if (hitstop > 0) { hitstop -= STEP; continue; }
    updatePlayer(STEP); updateFoes(STEP); updateParts(STEP);
    pressed.jump = pressed.attack = pressed.dash = released.jump = false;
    shake = Math.max(0, shake - STEP * 20);
  }
  cam.x += (P.x + P.w / 2 + P.face * 40 - VW / 2 - cam.x) * Math.min(1, dt * 6);
  cam.y += (P.y - VH * (usingTouch ? 0.42 : 0.55) - cam.y) * Math.min(1, dt * 4);
  cam.x = Math.max(0, Math.min(MW * TS - VW, cam.x)); cam.y = Math.max(-40, Math.min(MH * TS - VH + (usingTouch ? 70 : 0), cam.y));
  draw(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
