function drawBoss(ox, oy) {

  cx.fillStyle = C('#3FB8C4'); cx.fillRect(-28, -106 + bob, 14, 12); cx.fillRect(14, -106 + bob, 14, 12);

  cx.fillStyle = C('#3FB8C4'); cx.beginPath(); cx.moveTo(-12, -124 + bob); cx.quadraticCurveTo(-4, -142 + bob, 10, -134 + bob); cx.quadraticCurveTo(2, -130 + bob, 4, -124 + bob); cx.fill();

  }

}
function drawBossHud() {

const hud = document.getElementById('hud');
function updateHud() {
  const tv = HERO === 'tv';
  const ctl = usingTouch ? '' : `<br><b>←→</b> chạy · <b>Z/K/Space</b> nhảy · <b>X/J</b> ${tv ? 'bắn (giữ để nạp)' : 'chém'} · <b>C/L/Shift</b> lướt · <b>Q/Tab</b> đổi nhân vật · <b>R</b> về điểm lưu`;
  const lv = tv && P.aiming ? ['', ' · Nạp ●', ' · Nạp ●● ĐẦY'][chargeLv()] : '';
  hud.innerHTML = `<b>Long Thần Chiến Ký</b> — đang chơi <b>${tv ? 'Thanh Vũ' : 'Xích Long'}</b>${ctl}<br>Trúng: ${hits} · Hạ: ${kills}` +

let last = performance.now(), acc = 0; const STEP = 1 / 120;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  pollInput();
  while (acc >= STEP) {
    acc -= STEP; time += STEP; P.ox = P.x; P.oy = P.y;
    updateFx(STEP);
    if (hitstop > 0) { hitstop -= STEP; continue; }
    updatePlayerW(STEP); updateBoss(STEP); P.inv = Math.max(0, (P.inv || 0) - STEP); updateFoes(STEP); updateEshots(STEP); updateBolts(STEP); updateParts(STEP);

  cam.y += (P.y - VH * (usingTouch ? 0.38 : 0.5) - cam.y) * Math.min(1, dt * 4);
