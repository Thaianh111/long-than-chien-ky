<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Long Thần Chiến Ký — Bản thử điều khiển Xích Long</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  canvas{position:absolute;inset:0;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #hud{position:absolute;left:10px;top:8px;color:#f3e6c4;font-size:13px;line-height:1.45;
    text-shadow:0 1px 2px #000;pointer-events:none;max-width:60%}
  #hud b{color:#ffcf5a}
  #pad{position:absolute;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.07);opacity:.85;
    border:2px solid rgba(255,220,150,.45);color:#f3e6c4;font-weight:700;display:flex;
    align-items:center;justify-content:center;font-size:15px;touch-action:none}
  .btn.on{background:rgba(255,190,80,.38)}
  #rot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    color:#f3e6c4;background:#0b0d14;font-size:18px;padding:30px}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="pad">
  <div class="btn" data-k="left"  style="left:3%;bottom:8%;width:84px;height:84px">◀</div>
  <div class="btn" data-k="right" style="left:calc(3% + 96px);bottom:8%;width:84px;height:84px">▶</div>
  <div class="btn" data-k="dash"  style="right:calc(3% + 196px);bottom:6%;width:74px;height:74px">LƯỚT</div>
  <div class="btn" data-k="attack" style="right:calc(3% + 98px);bottom:20%;width:84px;height:84px">CHÉM</div>
  <div class="btn" data-k="jump"  style="right:3%;bottom:6%;width:88px;height:88px">NHẢY</div>
</div>
<div id="rot">Xoay ngang điện thoại để chơi thử 🔄</div>
<script>
/* =========================================================
   LONG THẦN CHIẾN KÝ — bản thử điều khiển (vứt đi sau khi thử)
   © Võ Thái Anh · VTA Games
   ---------------------------------------------------------
   CHỈNH CẢM GIÁC TAY Ở ĐÂY. Đơn vị: pixel (1 ô = 32px), giây.
   ========================================================= */
const T = {
  GRAVITY: 3000,          // trọng lực
  MAX_FALL: 1040,         // tốc độ rơi tối đa
  RUN_SPEED: 300,         // tốc độ chạy
  ACCEL_GROUND: 4400,     // tăng tốc trên đất
  ACCEL_AIR: 2600,        // đổi hướng trên không
  JUMP_VEL: 860,          // lực nhảy
  JUMP_CUT: 0.45,         // nhả nút nhảy sớm -> nhảy thấp (0..1)
  COYOTE: 0.09,           // vẫn nhảy được ngay sau khi rời mép
  JUMP_BUFFER: 0.12,      // bấm nhảy sớm trước khi chạm đất vẫn tính
  DASH_SPEED: 620,        // tốc độ lướt
  DASH_TIME: 0.30,        // thời gian lướt tối đa (giữ nút)
  DASH_MIN: 0.10,         // lướt ngắn nhất khi bấm nhả nhanh
  AIR_DASHES: 1,          // số lần lướt trên không (0 = như X1 gốc)
  WALL_SLIDE: 150,        // tốc độ trượt tường
  WALL_JUMP_VX: 350,      // lực bật ngang khi nhảy tường
  WALL_JUMP_VY: 820,      // lực bật dọc khi nhảy tường
  WALL_JUMP_LOCK: 0.13,   // khóa điều khiển sau khi bật tường
  WALL_KICK_VX: 180,      // giữ hướng VÀO tường + nhảy: đạp nhẹ để leo lên chính bức tường đó
  WALL_KICK_LOCK: 0.06,   // khóa điều khiển khi đạp leo tường
  HITSTOP: 0.055,         // khựng hình khi chém trúng
  SHAKE: 4,               // rung màn hình khi chém trúng
  BLADE_LEN: 58,          // chiều dài lưỡi đao laze
  BLADE_IDLE: 0.55,       // góc đao khi đứng (radian, 0 = thẳng ngang về trước)
  // 3 nhát chém kiểu đao laze: a0 -> a1 là góc quét lưỡi đao; len = hệ số dài lưỡi
  COMBO: [
    { time: 0.22, from: 0.03, to: 0.10, a0: -2.2, a1: 1.0,  len: 1.0,  reach: 66, h: 80,  dmg: 1, lunge: 50,  knock: 240 },
    { time: 0.24, from: 0.04, to: 0.11, a0: 1.1,  a1: -2.0, len: 1.05, reach: 70, h: 84,  dmg: 1, lunge: 70,  knock: 280 },
    { time: 0.36, from: 0.06, to: 0.16, a0: -2.7, a1: 1.7,  len: 1.4,  reach: 92, h: 110, dmg: 2, lunge: 220, knock: 520 },
  ],
  // --- hoạt ảnh (chỉ ảnh hưởng hình, không đổi cảm giác tay) ---
  SQUASH_K: 520,          // độ cứng lò xo co giãn (cao = bật về nhanh)
  SQUASH_D: 26,           // độ hãm lò xo (cao = ít nảy)
  STRIDE: 22,             // chạy được bao nhiêu px thì sang khung chạy kế tiếp (nhỏ = chân đảo nhanh)
  RUN_BOB: 0,             // nhún thêm bằng code (0 vì khung chạy đã tự nhún)
  GHOST_EVERY: 0.05,      // bao lâu để lại 1 bóng mờ khi lướt (giây)
  RECOVER: 0.09,
  DASH_PUSH: 0.05,        // giữ dáng đạp chân lúc bắt đầu lướt (giây)
  DASH_STOP: 0.1,         // dáng thắng gót khi lướt xong mà buông tay
  TAKEOFF_TIME: 0.05,     // giữ dáng nhún bật lên lúc mới rời đất (giây)
  APEX_VY: 260,           // tốc độ dọc dưới mức này thì dùng dáng đỉnh nhảy
  LAND_TIME: 0.09,        // dáng khuỵu khi đáp (chỉ khi đứng yên, đang chạy thì chạy luôn)
  LAND_MIN_VY: 300,       // rơi nhanh hơn mức này mới khuỵu          // giữ dáng chém thêm chút sau nhát cuối cho khỏi giật về
  AIR_SLASH: { time: 0.26, from: 0.02, to: 0.16, a0: -1.6, a1: 4.6, len: 1.2, reach: 76, h: 120, dmg: 1, lunge: 0, knock: 300 },
};

/* ---------------- hình nhân vật ---------------- */
const SPR = new Image(); SPR.src = 'xich-long.png';
const SPR_W = 41, SPR_H = 84, PIVOT = { x: 30, y: 45 };   // tay cầm đao trên sprite (mặt quay phải)
// các dáng hành động (vẽ bằng Gemini từ ảnh mẫu, đã cắt pixel): khung 150x110, chân ở giữa đáy
const FR = {}; ['idle','run','jump','dash','windup','slash_up','slash_thrust','x_overhead','run1','run2','run3','run4','run5','run6','run7','run8','jump1','jump2','jump3','jump4','jump5','dash1','dash2','dash3'].forEach(n => { FR[n] = new Image(); FR[n].src = 'frames/f_' + n + '.png'; });
const FW = 150, FH = 110;
const SWING_PIVOT = { x: 10, y: -50 };   // tâm vệt chém so với chân (mặt quay phải)

/* ---------------- màn chơi (vẽ bằng khối ô) ---------------- */
const TS = 32, MW = 110, MH = 17;
const map = Array.from({length: MH}, () => new Uint8Array(MW));
const rect = (x, y, w, h, v = 1) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < MW && j < MH) map[j][i] = v; };
rect(0, 15, MW, 2);            // nền
rect(0, 0, 1, MH);             // tường trái
rect(MW - 1, 0, 1, MH);        // tường phải
rect(10, 12, 4, 1); rect(16, 10, 3, 1);          // bậc thang
rect(22, 15, 4, 2, 0);                           // hố nhỏ (nhảy thường)
rect(34, 4, 1, 11); rect(38, 6, 1, 9);           // giếng nhảy tường
rect(38, 6, 6, 1);                               // gờ trên giếng
rect(44, 6, 1, 4);
rect(52, 15, 7, 2, 0);                           // hố lớn: cần LƯỚT + NHẢY
rect(64, 11, 5, 1); rect(72, 9, 5, 1); rect(80, 11, 5, 1);   // đấu trường
rect(90, 8, 1, 7);                               // tường cuối để tập bám
const checkpoints = [{ x: 3 * TS, y: 15 * TS }, { x: 46 * TS, y: 15 * TS }, { x: 61 * TS, y: 15 * TS }];
const solidAt = (px, py) => { const i = Math.floor(px / TS), j = Math.floor(py / TS); return i >= 0 && i < MW && j >= 0 && j < MH && map[j][i] === 1; };

/* ---------------- nhập liệu ---------------- */
const keys = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const touch = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const pad = { left: 0, right: 0, jump: 0, attack: 0, dash: 0 };
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'jump', KeyK: 'jump', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  KeyX: 'attack', KeyJ: 'attack', KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash' };
const tap = {};
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { if (!e.repeat) tap[k] = 1; keys[k] = 1; e.preventDefault(); } if (e.code === 'KeyR') respawn(); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = 0; e.preventDefault(); } });
const usingTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (usingTouch) document.getElementById('pad').style.display = 'block';
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); touch[k] = 1; tap[k] = 1; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touch[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});
addEventListener('contextmenu', e => e.preventDefault());
function readPad() {
  const g = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  for (const k in pad) pad[k] = 0;
  if (!g) return;
  const ax = g.axes[0] || 0, b = i => g.buttons[i] && g.buttons[i].pressed;
  pad.left = ax < -0.4 || b(14) ? 1 : 0; pad.right = ax > 0.4 || b(15) ? 1 : 0;
  pad.jump = b(0) ? 1 : 0; pad.attack = b(2) || b(3) ? 1 : 0; pad.dash = b(1) || b(5) || b(7) ? 1 : 0;
}
const held = {}, prev = {}, pressed = {}, released = {};
function pollInput() {
  readPad();
  for (const k in keys) {
    held[k] = keys[k] || touch[k] || pad[k] ? 1 : 0;
    pressed[k] = pressed[k] || tap[k] || (held[k] && !prev[k]); tap[k] = 0;
    released[k] = released[k] || (!held[k] && prev[k]); prev[k] = held[k];
  }
}

/* ---------------- người chơi: Xích Long ---------------- */
const P = { w: 22, h: 78 };
function resetPlayer(cp) {
  Object.assign(P, { x: cp.x, y: cp.y - P.h, vx: 0, vy: 0, face: 1, ground: false, coyote: 0, jumpBuf: 0,
    dash: 0, dashHeld: 0, airDashes: T.AIR_DASHES, dashMomentum: false, wall: 0, wallLock: 0,
    atk: null, atkT: 0, combo: 0, comboQueued: false, hitSet: new Set(), ghosts: [], swing: [], bladeA: T.BLADE_IDLE, bladeL: 1,
    ox: cp.x, oy: cp.y - P.h, sqx: 1, sqy: 1, vsx: 0, vsy: 0, gait: 0, ghostT: 0, recover: 0, recFrame: null, turnT: 0, lastFace: 1, airT: 0 });
}
let cpIndex = 0; resetPlayer(checkpoints[0]);
function respawn() { resetPlayer(checkpoints[cpIndex]); }

function collideX(o) {
  const top = o.y + 1, bot = o.y + o.h - 1;
  if (o.vx > 0) { const r = o.x + o.w; for (let y = top; y <= bot; y += 12) if (solidAt(r, y) || solidAt(r, bot)) { o.x = Math.floor(r / TS) * TS - o.w - 0.01; o.vx = 0; return 1; } }
  else if (o.vx < 0) { for (let y = top; y <= bot; y += 12) if (solidAt(o.x, y) || solidAt(o.x, bot)) { o.x = (Math.floor(o.x / TS) + 1) * TS + 0.01; o.vx = 0; return -1; } }
  return 0;
}
function collideY(o) {
  const l = o.x + 1, r = o.x + o.w - 1;
  o.ground = false;
  if (o.vy > 0) { const b = o.y + o.h; if (solidAt(l, b) || solidAt(r, b)) { o.y = Math.floor(b / TS) * TS - o.h; o.vy = 0; o.ground = true; } }
  else if (o.vy < 0) { if (solidAt(l, o.y) || solidAt(r, o.y)) { o.y = (Math.floor(o.y / TS) + 1) * TS; o.vy = 0; } }
}
const touchingWall = dir => { const x = dir > 0 ? P.x + P.w + 1 : P.x - 1; return solidAt(x, P.y + 8) && solidAt(x, P.y + P.h - 12); };

function startAttack() {
  const air = !P.ground;
  const step = air ? T.AIR_SLASH : T.COMBO[P.combo];
  P.atk = step; P.atkT = 0; P.hitSet = new Set(); P.comboQueued = false; P.atkAir = air; P.swing = [];
  if (!air && step.lunge) P.vx = P.face * step.lunge * 2.2;
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
function bladeAngle() {
  const a = P.atk;
  if (!a) return T.BLADE_IDLE;
  if (P.atkT < a.from) return a.a0;
  if (P.atkT > a.to) return a.a1;
  return a.a0 + (a.a1 - a.a0) * easeOut((P.atkT - a.from) / (a.to - a.from));
}

function squash(sx, sy) { P.sqx = sx; P.sqy = sy; P.vsx = 0; P.vsy = 0; }
function updateAnim(dt) {
  // lò xo co giãn: luôn bật về 1
  for (const [k, v] of [['sqx', 'vsx'], ['sqy', 'vsy']]) {
    P[v] += (-(P[k] - 1) * T.SQUASH_K - P[v] * T.SQUASH_D) * dt; P[k] += P[v] * dt;
  }
  if (P.ground && !P.dash && Math.abs(P.vx) > 40) {
    const before = Math.floor(P.gait);
    P.gait += Math.abs(P.vx) * dt / T.STRIDE;
    const now = Math.floor(P.gait); if (now !== before && now % 4 === 0) dust(P.x + P.w / 2 - P.face * 8, P.y + P.h, 3);
  } else P.gait = 0;
  if (P.face !== P.lastFace) { if (P.ground && !P.atk) { P.turnT = 0.08; squash(0.7, 1.04); } P.lastFace = P.face; }
  P.turnT = Math.max(0, P.turnT - dt);
  // vừa dứt lướt trên đất mà không bấm hướng -> trượt gót thắng lại
  if (P.wasDash && !P.dash && P.ground && !P.atk && !held.left && !held.right) { P.recFrame = ANIM.dash_stop[0]; P.recover = T.DASH_STOP; }
  P.wasDash = !!P.dash;
  P.recover = Math.max(0, P.recover - dt);
  P.landT = Math.max(0, (P.landT || 0) - dt); if (!P.ground || P.atk || P.dash) P.landT = 0;
  if (P.atk || P.dash || (!P.ground && P.recover)) P.recover = 0;
  P.airT = P.ground ? 0 : P.airT + dt;
}

function updatePlayer(dt) {
  const dirIn = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  P.coyote = P.ground ? T.COYOTE : Math.max(0, P.coyote - dt);
  P.jumpBuf = pressed.jump ? T.JUMP_BUFFER : Math.max(0, P.jumpBuf - dt);
  P.wallLock = Math.max(0, P.wallLock - dt);

  // --- chém ---
  if (pressed.attack) {
    if (!P.atk) { if (P.ground && P.combo > 2) P.combo = 0; startAttack(); }
    else if (!P.atkAir && P.combo < 2) P.comboQueued = true;
  }
  if (P.atk) {
    P.atkT += dt;
    if (P.atkT >= P.atk.time) {
      if (P.comboQueued && P.ground && !P.atkAir) { P.combo++; startAttack(); }
      else { P.recFrame = atkFrame(true); P.recover = T.RECOVER; P.atk = null; P.combo = 0; }
    }
  }
  // vệt chém: lưu góc lưỡi đao theo thời gian
  const target = bladeAngle();
  P.bladeA = P.atk ? target : P.bladeA + (target - P.bladeA) * Math.min(1, dt * 14);
  P.bladeL = P.atk ? P.atk.len : P.bladeL + (1 - P.bladeL) * Math.min(1, dt * 10);
  if (P.atk && P.atkT >= P.atk.from && P.atkT <= P.atk.to + 0.02) P.swing.push({ a: P.bladeA, l: P.bladeL, life: 0.12 });
  for (const s of P.swing) s.life -= dt;
  P.swing = P.swing.filter(s => s.life > 0);
  const groundSlashing = P.atk && !P.atkAir;

  // --- lướt ---
  if (pressed.dash && !P.dash && !groundSlashing) {
    if (P.ground) { P.dash = T.DASH_TIME; P.dashHeld = 0; squash(1.18, 0.88); dust(P.x + P.w / 2 - P.face * 10, P.y + P.h); }
    else if (P.airDashes > 0 && !P.wall) { P.airDashes--; P.dash = T.DASH_TIME * 0.8; P.dashHeld = 0; P.vy = 0; squash(1.18, 0.88); }
    if (P.dash && dirIn) P.face = dirIn;
  }
  if (P.dash) {
    P.dashHeld += dt; P.dash -= dt;
    if ((!held.dash && P.dashHeld > T.DASH_MIN) || (dirIn && dirIn !== P.face)) P.dash = 0;
    P.vx = P.face * T.DASH_SPEED;
    if (!P.ground) P.vy = Math.min(P.vy, 0);
    if (P.ground) P.dashMomentum = true;
    P.ghostT -= dt; if (P.ghostT <= 0) { P.ghostT = T.GHOST_EVERY; P.ghosts.push({ x: P.x, y: P.y, f: P.face, a: 0.6, n: pickFrame() }); }
    if (P.dash <= 0) P.dash = 0;
  }

  // --- chạy ---
  if (!P.dash && P.wallLock <= 0) {
    if (groundSlashing) { P.vx *= Math.pow(0.0005, dt); }
    else {
      const top = P.dashMomentum && !P.ground ? T.DASH_SPEED : T.RUN_SPEED;
      const tgt = dirIn * top;
      const acc = P.ground ? T.ACCEL_GROUND : T.ACCEL_AIR;
      if (P.vx < tgt) P.vx = Math.min(tgt, P.vx + acc * dt);
      else if (P.vx > tgt) P.vx = Math.max(tgt, P.vx - acc * dt);
      if (dirIn && !P.atk) P.face = dirIn;
    }
  }

  // --- bám tường ---
  P.wall = 0;
  if (!P.ground && !P.dash) {
    if (dirIn && touchingWall(dirIn) && P.vy > -120) P.wall = dirIn;
  }

  // --- nhảy ---
  if (P.jumpBuf > 0) {
    if (P.coyote > 0) {
      P.vy = -T.JUMP_VEL; P.coyote = 0; P.jumpBuf = 0; squash(0.82, 1.2); dust(P.x + P.w / 2, P.y + P.h);
      P.dashMomentum = !!(P.dash || held.dash); P.dash = 0; P.ground = false;
    } else if (!P.ground && (P.wall || touchingWall(-1) || touchingWall(1))) {
      const w = P.wall || (touchingWall(1) ? 1 : -1);
      const climb = dirIn === w;              // giữ hướng vào tường = leo lên chính bức tường
      P.dashMomentum = !!held.dash;
      P.vx = -w * (P.dashMomentum ? T.DASH_SPEED : climb ? T.WALL_KICK_VX : T.WALL_JUMP_VX);
      P.vy = -T.WALL_JUMP_VY; squash(0.85, 1.15); P.face = climb && !P.dashMomentum ? w : -w;
      P.wallLock = climb && !P.dashMomentum ? T.WALL_KICK_LOCK : T.WALL_JUMP_LOCK; P.jumpBuf = 0; P.wall = 0;
      sparks(P.x + (w > 0 ? P.w : 0), P.y + P.h - 8, 6, '#ffd34d');
    }
  }
  if (released.jump && P.vy < 0) P.vy *= T.JUMP_CUT;

  // --- trọng lực ---
  if (!(P.dash && !P.ground)) {
    P.vy = Math.min(P.vy + T.GRAVITY * dt, T.MAX_FALL);
    if (P.wall && P.vy > T.WALL_SLIDE) { P.vy = T.WALL_SLIDE; if (Math.random() < 0.3) sparks(P.x + (P.wall > 0 ? P.w : 0), P.y + 12, 1, '#ffb347'); }
  }

  P.x += P.vx * dt; collideX(P);
  const wasGround = P.ground, fallV = P.vy;
  P.y += P.vy * dt; collideY(P);
  if (P.ground) { P.airDashes = T.AIR_DASHES; if (!P.dash) P.dashMomentum = false; if (!wasGround) { dust(P.x + P.w / 2, P.y + P.h); if (fallV > T.LAND_MIN_VY) P.landT = T.LAND_TIME; const k = Math.min(1, fallV / T.MAX_FALL); squash(1 + 0.22 * k, 1 - 0.24 * k); } }
  if (P.ground && P.atkAir) { P.atk = null; P.combo = 0; }

  checkpoints.forEach((c, i) => { if (P.x > c.x - 16 && i > cpIndex) cpIndex = i; });
  if (P.y > MH * TS + 80) respawn();

  updateAnim(dt);
  P.ghosts.forEach(g => g.a -= dt * 2.4); P.ghosts = P.ghosts.filter(g => g.a > 0);
}

// điểm tay cầm đao trong thế giới
function handPos() {
  const sx = P.x + P.w / 2 - SPR_W / 2, sy = P.y + P.h - SPR_H;
  const px = P.face > 0 ? PIVOT.x : SPR_W - PIVOT.x;
  return { x: sx + px, y: sy + PIVOT.y };
}
function slashBox() {
  const a = P.atk; if (!a || P.atkT < a.from || P.atkT > a.to) return null;
  const hp = handPos();
  const x = P.face > 0 ? hp.x - 14 : hp.x - a.reach + 14;
  return { x, y: hp.y - a.h / 2, w: a.reach, h: a.h };
}

/* ---------------- quái để chém thử ---------------- */
const foes = [];
const addFoe = (type, tx, ty) => { const w = type === 'drone' ? 30 : 34, h = type === 'drone' ? 26 : 46;
  foes.push({ type, ox: tx * TS, oy: ty * TS + TS - h, x: tx * TS, y: ty * TS + TS - h, w, h,
  hp: type === 'drone' ? 3 : 5, maxHp: type === 'drone' ? 3 : 5, vx: 0, vy: 0, flash: 0, dead: 0, t: Math.random() * 6, dir: -1 }); };
addFoe('drone', 13, 9); addFoe('walker', 28, 14); addFoe('drone', 47, 4); addFoe('walker', 66, 14); addFoe('drone', 74, 7);
addFoe('walker', 82, 14); addFoe('drone', 86, 10); addFoe('walker', 96, 14);
function updateFoes(dt) {
  const box = slashBox();
  for (const f of foes) {
    if (f.dead > 0) { f.dead -= dt; if (f.dead <= 0) Object.assign(f, { x: f.ox, y: f.oy, hp: f.maxHp, vx: 0, vy: 0 }); continue; }
    f.t += dt; f.flash = Math.max(0, f.flash - dt);
    if (f.type === 'drone') {
      f.vx *= Math.pow(0.02, dt); f.x += f.vx * dt;
      f.y = f.oy + Math.sin(f.t * 2) * 10 + (f.kby || 0); f.kby = (f.kby || 0) * Math.pow(0.05, dt);
    } else {
      if (Math.abs(f.vx) < 60) f.vx = f.dir * 60;
      f.vy = Math.min(f.vy + T.GRAVITY * dt, T.MAX_FALL);
      f.x += f.vx * dt; if (collideX(f)) f.dir *= -1;
      const ahead = f.dir > 0 ? f.x + f.w + 4 : f.x - 4;
      f.y += f.vy * dt; collideY(f);
      if (f.ground && !solidAt(ahead, f.y + f.h + 8) && Math.abs(f.vx) <= 61) { f.dir *= -1; f.vx = f.dir * 60; }
      if (Math.abs(f.vx) > 60) f.vx *= Math.pow(0.01, dt);
      if (f.y > MH * TS + 80) f.dead = 0.01;
    }
    if (box && !P.hitSet.has(f) && box.x < f.x + f.w && box.x + box.w > f.x && box.y < f.y + f.h && box.y + box.h > f.y) {
      P.hitSet.add(f); f.hp -= P.atk.dmg; f.flash = 0.12;
      f.vx = P.face * P.atk.knock; if (f.type === 'drone') f.kby = -16; else f.vy = -240;
      hitstop = T.HITSTOP * (P.atk.dmg > 1 ? 1.8 : 1); shake = T.SHAKE * (P.atk.dmg > 1 ? 2 : 1);
      sparks(f.x + f.w / 2, f.y + f.h / 2, 10, '#ff6a2b'); hits++;
      if (f.hp <= 0) { f.dead = 2.5; sparks(f.x + f.w / 2, f.y + f.h / 2, 26, '#ffd34d'); kills++; }
    }
  }
}

/* ---------------- hiệu ứng ---------------- */
const parts = [];
function sparks(x, y, n, c) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 80 + Math.random() * 320; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.25 + Math.random() * 0.3, c }); } }
function dust(x, y, n = 6) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 20, y, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 80, life: 0.3, c: '#9aa3b5' }); }
function updateParts(dt) { for (const p of parts) { p.life -= dt; p.vy += 1000 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1); }
let hitstop = 0, shake = 0, hits = 0, kills = 0, renderAlpha = 1;

/* ---------------- vẽ ---------------- */
let VW = 640; const VH = 360;
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cv.height = VH;
function fit() { VW = Math.round(Math.max(560, Math.min(800, VH * innerWidth / innerHeight))); cv.width = VW; cx.imageSmoothingEnabled = false; const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px'; }
addEventListener('resize', fit); fit();
const cam = { x: 0, y: 0 };
let time = 0;

// lưỡi đao laze: một lưỡi cong, gốc ở tay cầm; hệ trục: x+ = phía trước mặt
function bladePath(a, len) {
  const L = T.BLADE_LEN * len, c = Math.cos(a), s = Math.sin(a), nx = -s, ny = c;
  const pt = (t, off) => [c * L * t + nx * off, s * L * t + ny * off];
  const spine = [pt(0, -2), pt(0.5, -3), pt(1, 0)];
  const edge = [pt(0.75, 6), pt(0.4, 6), pt(0.05, 3)];
  return spine.concat(edge);
}
function pathOf(pts) { cx.beginPath(); pts.forEach(([x, y], i) => i ? cx.lineTo(x, y) : cx.moveTo(x, y)); cx.closePath(); }
function drawBlade(a, len, flicker) {
  const pts = bladePath(a, len);
  cx.globalAlpha = 0.35 + flicker * 0.15; cx.lineWidth = 6; cx.strokeStyle = '#ff5a1f'; pathOf(pts); cx.stroke();
  cx.globalAlpha = 1; cx.fillStyle = '#ff6a2b'; pathOf(pts); cx.fill();
  const L = T.BLADE_LEN * len, c = Math.cos(a), s = Math.sin(a);
  cx.strokeStyle = '#fff3c0'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(c * 3, s * 3); cx.lineTo(c * (L - 4) - s * 2, s * (L - 4) + c * 2); cx.stroke();
  // chuôi đầu rồng
  cx.fillStyle = '#C9A227'; cx.fillRect(-4, -3, 7, 6); cx.fillStyle = '#7a5a12'; cx.fillRect(-7, -2, 4, 4);
}
// vệt chém hình lưỡi liềm
function drawSwing() {
  const sw = P.swing; if (sw.length < 2) return;
  for (let i = 1; i < sw.length; i++) {
    const a0 = sw[i - 1].a, a1 = sw[i].a, L = T.BLADE_LEN * sw[i].l, k = Math.min(1, sw[i].life / 0.12);
    if (Math.abs(a1 - a0) < 0.001) continue;
    const ccw = a1 < a0;
    cx.globalAlpha = 0.8 * k; cx.fillStyle = '#ff3b1f';
    cx.beginPath(); cx.arc(0, 0, L + 4, a0, a1, ccw); cx.arc(0, 0, L * 0.35, a1, a0, !ccw); cx.closePath(); cx.fill();
    cx.globalAlpha = 0.95 * k; cx.fillStyle = '#ffb347';
    cx.beginPath(); cx.arc(0, 0, L + 2, a0, a1, ccw); cx.arc(0, 0, L * 0.7, a1, a0, !ccw); cx.closePath(); cx.fill();
    cx.fillStyle = '#fff3c0';
    cx.beginPath(); cx.arc(0, 0, L + 2, a0, a1, ccw); cx.arc(0, 0, L - 4, a1, a0, !ccw); cx.closePath(); cx.fill();
  }
  cx.globalAlpha = 1;
}


// Điểm neo của từng dáng = vị trí HÔNG trong khung 150x110 (chân luôn chạm đáy khung).
// Trước đây mọi dáng đều canh giữa khung nên đổi dáng là thân người nhảy ngang tới 30px -> giật.
const FA = { dash1: 75, dash2: 67, dash3: 70,
  jump1: 76, jump2: 80, jump3: 71, jump4: 74, jump5: 74,
  run1: 68, run2: 75, run3: 75, run4: 72, run5: 68, run6: 75, run7: 76, run8: 73,
  idle: 73, run: 57, jump: 98, dash: 88, windup: 74, slash_thrust: 75, slash_up: 80, x_overhead: 79 };
// Tâm vệt chém (vai) so với chân, theo từng nhát
const SWING_AT = { 0: { x: 8, y: -52 }, 1: { x: 8, y: -56 }, 2: { x: 10, y: -50 }, air: { x: 2, y: -58 } };
// Thêm khung mới: bỏ file vào frames/ rồi ghi tên vào đây theo thứ tự (vd run: ['run1','run2',...]).
const ANIM = { idle: ['idle'], run: ['run1', 'run2', 'run3', 'run4', 'run5', 'run6', 'run7', 'run8'], takeoff: ['jump1'], jump_up: ['jump2'], apex: ['jump3'], jump_down: ['jump4'], land: ['jump5'], wall: ['jump'], dash: ['dash2'], dash_start: ['dash1'], dash_stop: ['dash3'] };

function atkFrame(endPose) {
  const a = P.atk; if (!a) return null;
  const pre = !endPose && P.atkT < a.from;
  if (P.atkAir) return pre ? 'slash_up' : 'x_overhead';
  if (P.combo === 0) return pre ? 'windup' : 'slash_thrust';
  if (P.combo === 1) return pre ? 'slash_thrust' : 'slash_up';
  return pre ? 'slash_up' : 'slash_thrust';
}
function seq(name, t, fps = 10) { const a = ANIM[name]; return a[Math.floor(t * fps) % a.length]; }
function pickFrame() {
  if (P.atk) return atkFrame();
  if (P.recover > 0 && P.recFrame) return P.recFrame;
  if (P.dash) return P.ground && P.dashHeld < T.DASH_PUSH ? seq('dash_start', time) : seq('dash', time);
  if (P.wall) return seq('wall', time);
  if (!P.ground) {
    if (P.vy < 0 && P.airT < T.TAKEOFF_TIME) return seq('takeoff', P.airT);
    return seq(P.vy < -T.APEX_VY ? 'jump_up' : P.vy < T.APEX_VY ? 'apex' : 'jump_down', P.airT);
  }
  if (P.landT > 0 && Math.abs(P.vx) <= 40) return seq('land', P.landT);
  if (Math.abs(P.vx) > 40) return ANIM.run[Math.floor(P.gait) % ANIM.run.length];
  return seq('idle', time, 6);
}
// Bóng mờ khi lướt: tô màu đỏ cam một lần rồi giữ lại
const tintCache = {};
function tinted(name) {
  if (tintCache[name]) return tintCache[name];
  const img = FR[name]; if (!img.complete || !img.naturalWidth) return null;
  const c = document.createElement('canvas'); c.width = FW; c.height = FH; const g = c.getContext('2d');
  g.drawImage(img, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#ff5a1f'; g.fillRect(0, 0, FW, FH);
  return (tintCache[name] = c);
}
function drawPose(name, alpha) {
  const fr = FR[name];
  if (fr && fr.complete && fr.naturalWidth) cx.drawImage(fr, -FA[name], -FH + 2);
  else if (SPR.complete && SPR.naturalWidth) cx.drawImage(SPR, -SPR_W / 2, -SPR_H);
}
function drawPlayer(alpha) {
  const rx = P.ox + (P.x - P.ox) * alpha, ry = P.oy + (P.y - P.oy) * alpha;
  const sx = Math.round(rx + P.w / 2 - cam.x), sy = Math.round(ry + P.h - cam.y), f = P.face;
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const g of P.ghosts) {
    const t = tinted(g.n); if (!t) continue;
    cx.save(); cx.globalAlpha = g.a * 0.5; cx.translate(Math.round(g.x + P.w / 2 - cam.x), Math.round(g.y + P.h - cam.y)); cx.scale(g.f, 1);
    cx.drawImage(t, -FA[g.n], -FH + 2); cx.restore();
  }
  cx.restore();
  const name = pickFrame();
  // nhún khi chạy: 2 lần mỗi chu kỳ bước, kèm nghiêng người theo tốc độ
  let bob = 0, rot = 0;
  if (name === ANIM.run[Math.floor(P.gait) % ANIM.run.length] && P.ground && Math.abs(P.vx) > 40) {
    const ph = (P.gait % 4) / 4; bob = Math.sin(ph * Math.PI) * T.RUN_BOB; rot = 0.02;
  }
  if (!P.ground && !P.wall && !P.atk && !P.dash) rot = Math.max(-0.03, Math.min(0.04, P.vy / 20000));
  if (P.dash) rot = 0;
  cx.save();
  cx.translate(sx, sy - Math.round(bob)); cx.scale(f, 1);
  if (P.wall) { cx.scale(-1, 1); cx.translate(-6, 0); }
  cx.rotate(rot);
  cx.scale(P.sqx, P.sqy);
  if (P.atk || P.swing.length) { const sp = SWING_AT[P.atkAir ? 'air' : P.combo] || SWING_AT[0]; cx.save(); cx.translate(sp.x, sp.y); drawSwing(); cx.restore(); }
  drawPose(name);
  cx.restore();
}

function draw() {
  const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0, sy = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  const gr = cx.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#141a2e'); gr.addColorStop(1, '#2a2440');
  cx.fillStyle = gr; cx.fillRect(0, 0, VW, VH);
  cx.save(); cx.translate(Math.round(sx), Math.round(sy));
  cx.fillStyle = '#1d2238';
  for (let i = 0; i < 12; i++) { const bx = i * 160 - (cam.x * 0.25) % 160; cx.beginPath(); cx.moveTo(bx, 300); cx.lineTo(bx + 80, 150 + (i % 3) * 30); cx.lineTo(bx + 160, 300); cx.fill(); }
  cx.strokeStyle = 'rgba(212,175,55,.18)'; cx.lineWidth = 2; cx.beginPath();
  for (let t = 0; t < 18.8; t += 0.1) { const r = 8 + t * 4, px = VW * 0.78 - cam.x * 0.08 + Math.cos(t + time * 0.2) * r, py = 90 + Math.sin(t + time * 0.2) * r * 0.5; t ? cx.lineTo(px, py) : cx.moveTo(px, py); }
  cx.stroke();
  const ox = Math.round(cam.x), oy = Math.round(cam.y);
  const i0 = Math.floor(ox / TS), i1 = i0 + Math.ceil(VW / TS) + 2;
  for (let j = 0; j < MH; j++) for (let i = i0; i < i1; i++) {
    if (i < 0 || i >= MW || map[j][i] !== 1) continue;
    const X = i * TS - ox, Y = j * TS - oy;
    cx.fillStyle = '#2e3346'; cx.fillRect(X, Y, TS, TS);
    cx.fillStyle = '#3c4259'; cx.fillRect(X, Y, TS, 5);
    cx.fillStyle = '#262a3a'; cx.fillRect(X, Y + TS - 2, TS, 2); cx.fillRect(X + TS - 2, Y, 2, TS);
    if (j === 0 || map[j - 1][i] !== 1) { cx.fillStyle = '#C9A227'; cx.fillRect(X, Y, TS, 2); }
  }
  cx.fillStyle = 'rgba(60,110,150,.55)';
  for (let X = 0; X < VW; X += 4) { const wy = MH * TS - 20 - oy + Math.sin((X + ox) * 0.03 + time * 3) * 3; cx.fillRect(X, wy, 4, VH); }
  checkpoints.forEach((c, i) => { const X = c.x - ox, Y = c.y - oy; cx.fillStyle = '#888'; cx.fillRect(X, Y - 52, 3, 52); cx.fillStyle = i <= cpIndex ? '#d8352a' : '#555'; cx.fillRect(X + 3, Y - 52, 22, 14); });
  for (const f of foes) {
    if (f.dead > 0) continue;
    const X = Math.round(f.x - ox), Y = Math.round(f.y - oy);
    cx.fillStyle = f.flash > 0 ? '#fff' : (f.type === 'drone' ? '#4c7a8f' : '#5b4f7a');
    if (f.type === 'drone') { cx.fillRect(X, Y + 6, f.w, f.h - 12); cx.fillRect(X + 8, Y, f.w - 16, f.h); cx.fillStyle = '#9fe8ff'; cx.fillRect(X + 11, Y + 9, 8, 8); }
    else { cx.fillRect(X, Y, f.w, f.h); cx.fillStyle = '#ff5a5a'; cx.fillRect(f.dir > 0 ? X + 22 : X + 4, Y + 10, 8, 5); }
    cx.fillStyle = '#000'; cx.fillRect(X, Y - 9, f.w, 4); cx.fillStyle = '#ffcf5a'; cx.fillRect(X, Y - 9, f.w * f.hp / f.maxHp, 4);
  }
  drawPlayer(renderAlpha);
  for (const p of parts) { cx.globalAlpha = Math.min(1, p.life * 3); cx.fillStyle = p.c; cx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), 3, 3); }
  cx.globalAlpha = 1;
  cx.fillStyle = 'rgba(243,230,196,.75)'; cx.font = '12px sans-serif';
  [[24, 'Hố nhỏ: nhảy thường'], [34.5, 'Giếng: bám tường + nhảy (giữ hướng vào tường để leo)'], [50, 'Hố lớn: LƯỚT rồi NHẢY'], [62, 'Đấu trường: tập combo 3 nhát đao laze']]
    .forEach(([tx, s]) => cx.fillText(s, tx * TS - ox - 60, 2.5 * TS - oy));
  cx.restore();
}

/* ---------------- vòng lặp ---------------- */
const hud = document.getElementById('hud');
function updateHud() {
  const ctl = usingTouch ? '' : '<br><b>←→</b> chạy · <b>Z/K/Space</b> nhảy · <b>X/J</b> chém · <b>C/L/Shift</b> lướt · <b>R</b> về điểm lưu';
  hud.innerHTML = `<b>Long Thần Chiến Ký</b> — bản thử điều khiển Xích Long${ctl}<br>Trúng: ${hits} · Hạ: ${kills}` +
    (P.atk && !P.atkAir ? ` · Combo ${P.combo + 1}/3` : '');
}
let last = performance.now(), acc = 0; const STEP = 1 / 120;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  pollInput();
  while (acc >= STEP) {
    acc -= STEP; time += STEP; P.ox = P.x; P.oy = P.y;
    if (hitstop > 0) { hitstop -= STEP; continue; }
    updatePlayer(STEP); updateFoes(STEP); updateParts(STEP);
    pressed.jump = pressed.attack = pressed.dash = released.jump = false;
    shake = Math.max(0, shake - STEP * 30);
  }
  cam.x += (P.x + P.w / 2 + P.face * 80 - VW / 2 - cam.x) * Math.min(1, dt * 6);
  cam.y += (P.y - VH * (usingTouch ? 0.38 : 0.5) - cam.y) * Math.min(1, dt * 4);
  cam.x = Math.max(0, Math.min(MW * TS - VW, cam.x)); cam.y = Math.max(-80, Math.min(MH * TS - VH + (usingTouch ? 90 : 0), cam.y));
  renderAlpha = hitstop > 0 ? 1 : acc / STEP;
  draw(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
